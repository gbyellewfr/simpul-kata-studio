<!DOCTYPE html>
<html lang="id">
<head>

  <title>Simpul Kata — Cross Stitch Studio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪡</text></svg>">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Inter + Vintage Calligraphy Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <style>
    :root {
      color-scheme: dark;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #141417;
      color: #F4F4F5;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #workspaceViewport {
      touch-action: none;
      background-color: #141417;
      background-image: radial-gradient(#24242B 1px, transparent 1px);
      background-size: 20px 20px;
    }
    #editorCanvas {
      touch-action: none;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.68), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 999px;
      background: #2E2E38;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 999px;
      background: #E11D48;
      border: 2px solid #FFFFFF;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
    }
  </style>
</head>
